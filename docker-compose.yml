version: '3.8'

services:
  game:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ── Optional TTS configuration ──────────────────────────────────────────
      # Browser Web Speech API is used by default (no extra config needed).
      # To use OpenAI TTS:
      #   - TTS_PROVIDER=openai
      #   - OPENAI_API_KEY=sk-...
      #   - TTS_VOICE=alloy           # alloy | echo | fable | onyx | nova | shimmer
      # To use a custom TTS endpoint:
      #   - TTS_PROVIDER=custom
      #   - TTS_ENDPOINT_URL=https://your-tts-service/speak
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/tts/config"]
      interval: 30s
      timeout: 5s
      retries: 3
